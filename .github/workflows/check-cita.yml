name: Check Cita Sevilla

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cita:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor once
        env:
          SAVE_ALL_SCREENSHOTS: "false"
        run: python check_cita.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cita-monitor-results
          path: |
            data/results.csv
            screenshots/
            debug/
            logs/
          if-no-files-found: ignore
