name: Check Cita Sevilla

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-cita-sevilla
  cancel-in-progress: false

jobs:
  check-cita:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          SAVE_ALL_SCREENSHOTS: "false"
        run: python check_cita.py

      - name: Commit CSV results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.csv
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi
          git commit -m "Update cita results"
          git pull --rebase --autostash origin main
          git push

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cita-monitor-results
          path: |
            data/results.csv
            screenshots/
            debug/
          if-no-files-found: ignore
